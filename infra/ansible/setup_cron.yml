---
- name: Deploy Cron Jobs
  hosts: all
  become: yes
  vars:
    cron_python_version: "3.13.3"  # Already installed for sparrow_cam_app by setup_archive_api.yml

  tasks:
    - name: Update apt cache
      include_tasks: tasks/apt_update.yml

    - name: Setup pyenv and virtualenv for sparrow_cam_app (cron)
      include_tasks: tasks/pyenv_setup.yml
      vars:
        python_version: "{{ cron_python_version }}"
        virtualenv_name: sparrow_cam_cron
        app_user: sparrow_cam_app
        app_home: /opt/sparrow_cam_app

    - name: Clone sparrow_cam repo with sparse checkout for app/cron
      shell: |
        if [ ! -d /opt/sparrow_cam_app/source/.git ]; then
          git clone --no-checkout --filter=blob:none https://github.com/dev-michal-skiba/sparrow-cam.git /opt/sparrow_cam_app/source
        fi
        git -C /opt/sparrow_cam_app/source sparse-checkout init --cone
        git -C /opt/sparrow_cam_app/source sparse-checkout add app/cron
        git -C /opt/sparrow_cam_app/source pull origin master
        git -C /opt/sparrow_cam_app/source checkout master
      args:
        executable: /bin/bash
      become_user: sparrow_cam_app
      environment:
        HOME: /opt/sparrow_cam_app

    - name: Install cron app with dependencies
      shell: |
        source ~/.pyenvrc
        pyenv activate sparrow_cam_cron
        pip install --upgrade pip setuptools wheel
        pip install -e /opt/sparrow_cam_app/source/app/cron
      args:
        executable: /bin/bash
      become: yes
      become_user: sparrow_cam_app
      environment:
        HOME: /opt/sparrow_cam_app
        PYENV_ROOT: /opt/sparrow_cam_app/.pyenv

    - name: Install daily cleanup_recordings cron job at 23:05
      cron:
        name: "sparrow_cam cleanup_recordings"
        user: sparrow_cam_app
        minute: "5"
        hour: "23"
        job: >-
          PYTHONUNBUFFERED=1
          /opt/sparrow_cam_app/.pyenv/versions/sparrow_cam_cron/bin/python -m cron.jobs.cleanup_recordings
          >> /opt/sparrow_cam_app/tmp/cron_cleanup_recordings.log 2>&1

    - name: Install AWS CLI
      apt:
        name: awscli
        state: present

    - name: Create .aws directory for sparrow_cam_app
      file:
        path: /opt/sparrow_cam_app/.aws
        state: directory
        owner: sparrow_cam_app
        group: sparrow_cam_app
        mode: '0700'

    - name: Deploy AWS credentials for sparrow_cam_app
      copy:
        src: .secrets/aws_credentials
        dest: /opt/sparrow_cam_app/.aws/credentials
        owner: sparrow_cam_app
        group: sparrow_cam_app
        mode: '0600'

    - name: Install daily sync_dataset cron job at 23:35
      cron:
        name: "sparrow_cam sync_dataset"
        user: sparrow_cam_app
        minute: "35"
        hour: "23"
        job: >-
          /usr/bin/aws s3 sync /var/www/html/storage/sparrow_cam/dataset s3://sparrow-cam-dataset --delete
          >> /opt/sparrow_cam_app/tmp/cron_sync_dataset.log 2>&1
